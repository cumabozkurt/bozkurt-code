name: Release

# Builds the CLI/daemon/MCP binaries for every desktop target, bundles them as
# Tauri sidecars (tauri.sidecar.conf.json), produces the desktop installers with
# tauri-action (tauri.release.conf.json: licences + signed updater artifacts and
# latest.json) and uploads everything (plus CLI archives and SHA256SUMS) to a
# DRAFT GitHub Release. Publishing the draft is a manual step; the updater
# endpoint (/releases/latest/download/latest.json) only resolves once published.
#
# Secrets / variables (all optional except where noted):
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)  updater signing key (`tauri signer generate`)
#   vars.TAURI_UPDATER_PUBKEY                matching public key (contents of the .pub file)
#     -> without both, the release still builds but ships no updater artifacts.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   KEYCHAIN_PASSWORD, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  macOS signing/notarization
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD           Authenticode

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SIDECAR_DIR: apps/desktop/src-tauri/binaries

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches every version string (fails on mismatch)
        run: node scripts/check-versions.mjs "$TAG"
      - name: Find or create draft release
        id: release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const tag = process.env.TAG;
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existing = releases.find(r => r.tag_name === tag);
            if (existing) {
              core.info(`Reusing release ${existing.id} (draft=${existing.draft})`);
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `BOZKURT CODE ${tag}`,
              draft: true, prerelease: tag.includes('-'), generate_release_notes: true,
            });
            return data.id;

  licenses:
    name: Third-party licences
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install npm dependencies
        run: npm ci
      - name: Generate THIRD_PARTY_LICENSES.md
        run: |
          cargo metadata --format-version 1 --locked > "$RUNNER_TEMP/metadata.json"
          python3 scripts/third-party-licenses.py --metadata "$RUNNER_TEMP/metadata.json" > THIRD_PARTY_LICENSES.md
          wc -c THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error
      - name: Attach to draft release
        run: gh release upload "$TAG" THIRD_PARTY_LICENSES.md --clobber

  build:
    name: Build ${{ matrix.target }}
    needs: [create-release, licenses]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            archive: tar.gz
          # ubuntu-22.04-arm runners exist for public repositories only.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            bundles: deb,rpm,appimage
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bundles: app,dmg
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: app,dmg
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bundles: msi,nsis
            archive: zip
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential curl wget file rpm

      - name: Install npm dependencies
        shell: bash
        run: npm ci

      - name: Fetch THIRD_PARTY_LICENSES.md
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: third-party-licenses
          path: .

      - name: Build bozkurtd / bz / bozkurt-mcp
        shell: bash
        run: |
          cargo build --release --locked --target "$TARGET" -p bz-daemon -p bz-cli -p bz-mcp

      - name: Stage Tauri sidecars (name-<target-triple>)
        shell: bash
        run: |
          mkdir -p "$SIDECAR_DIR"
          for b in bozkurtd bz bozkurt-mcp; do
            cp "target/$TARGET/release/${b}${EXE}" "$SIDECAR_DIR/${b}-${TARGET}${EXE}"
          done
          ls -la "$SIDECAR_DIR"

      - name: Package CLI archive
        id: cli
        shell: bash
        run: |
          stage="$RUNNER_TEMP/bozkurt-cli"
          rm -rf "$stage" && mkdir -p "$stage" dist
          for b in bozkurtd bz bozkurt-mcp; do
            cp "target/$TARGET/release/${b}${EXE}" "$stage/"
          done
          cp LICENSE-MIT LICENSE-APACHE README.md THIRD_PARTY_LICENSES.md "$stage/"
          name="bozkurt-cli-${TARGET}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/dist/${name}.zip" ./* >/dev/null)
            echo "file=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C "$stage" -czf "dist/${name}.tar.gz" .
            echo "file=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload CLI archive to draft release
        shell: bash
        run: gh release upload "$TAG" "${{ steps.cli.outputs.file }}" --clobber

      # ---- Tauri config overlays -------------------------------------------
      # tauri.sidecar.conf.json  -> bundle.externalBin (bozkurtd, bz, bozkurt-mcp)
      # tauri.release.conf.json  -> THIRD_PARTY_LICENSES.md resource, updater artifacts + plugin
      #                            config; the pubkey placeholder is replaced from
      #                            vars.TAURI_UPDATER_PUBKEY, or the updater parts are removed
      #                            when no signing key is configured (forks, dry runs).
      - name: Prepare release config overlay
        id: overlay
        shell: bash
        run: |
          out="$RUNNER_TEMP/tauri.release.json"
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            if [ -z "$UPDATER_PUBKEY" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but the repository variable TAURI_UPDATER_PUBKEY is empty"
              exit 1
            fi
            jq --arg k "$UPDATER_PUBKEY" '.plugins.updater.pubkey = $k' \
              apps/desktop/src-tauri/tauri.release.conf.json > "$out"
          else
            echo "::warning::No updater signing key: building without updater artifacts / latest.json"
            jq 'del(.bundle.createUpdaterArtifacts) | del(.plugins.updater)' \
              apps/desktop/src-tauri/tauri.release.conf.json > "$out"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # ---- optional code signing (skipped when secrets are absent) ----------
      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $cfg = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5
          $cfgPath = Join-Path $env:RUNNER_TEMP 'tauri.windows-sign.json'
          Set-Content -Path $cfgPath -Value $cfg -Encoding utf8
          "TAURI_EXTRA_ARGS=--config $cfgPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- desktop bundles --------------------------------------------------
      - name: Build desktop app (signed + notarized macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARIZE == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # Passed only to this step (not via GITHUB_ENV); Tauri notarizes when they are set.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.sidecar.conf.json --config ${{ steps.overlay.outputs.path }}

      - name: Build desktop app (signed macOS, not notarized)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARIZE != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.sidecar.conf.json --config ${{ steps.overlay.outputs.path }}

      - name: Build desktop app
        if: runner.os != 'macOS' || env.HAS_APPLE_CERT != 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.sidecar.conf.json --config ${{ steps.overlay.outputs.path }} ${{ env.TAURI_EXTRA_ARGS }}

      # ---- the bundles must contain the sidecars (regression guard for P0-1) ----
      - name: Assert sidecars are inside the bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          missing=0
          # check <listing> <pattern> <bundle>: listing captured first (grep -q + pipefail = SIGPIPE).
          check() { if ! printf '%s\n' "$1" | grep -Eq "$2"; then echo "::error::$3 does not contain $2"; missing=1; fi; }
          case "$RUNNER_OS" in
            macOS)
              app="$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n1)"
              for b in bozkurtd bz bozkurt-mcp; do
                [ -x "$app/Contents/MacOS/$b" ] || { echo "::error::$app lacks Contents/MacOS/$b"; missing=1; }
              done ;;
            Linux)
              deb="$(find "$bundle/deb" -name '*.deb' | head -n1)"
              rpm="$(find "$bundle/rpm" -name '*.rpm' | head -n1)"
              deb_list="$(dpkg -c "$deb")"
              rpm_list="$(rpm -qlp "$rpm" 2>/dev/null)"
              for b in bozkurtd bz bozkurt-mcp; do
                check "$deb_list" "usr/bin/$b\$" "$deb"
                check "$rpm_list" "/usr/bin/$b\$" "$rpm"
              done ;;
            Windows)
              nsis="$(find "$bundle/nsis" -name '*.exe' | head -n1)"
              nsis_list="$(7z l "$nsis")"
              for b in bozkurtd bz bozkurt-mcp; do
                check "$nsis_list" "$b\.exe" "$nsis"
              done ;;
          esac
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "sidecars present"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage

      - name: Keep bundles as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundles-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.sig
            dist/*

  checksums:
    name: SHA256SUMS
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - name: Compute and upload SHA256SUMS
        run: scripts/release-checksums.sh "$TAG"
