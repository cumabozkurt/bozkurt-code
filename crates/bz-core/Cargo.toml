[package]
name = "bz-core"
description = "BOZKURT CODE core engine: paths, config, state, catalogs, installers, runtimes, services, sites, supervisor, project detection, Caddyfile generation, events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# native roots too: corporate/intercepting proxies install their CA in the OS store
reqwest = { workspace = true, features = ["rustls-tls-native-roots"] }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# native directory junctions (FSCTL_SET_REPARSE_POINT), no `cmd /C mklink` (P1-9)
junction = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
