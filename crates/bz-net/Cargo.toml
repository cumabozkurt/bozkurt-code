[package]
name = "bz-net"
description = "BOZKURT CODE networking: local DNS responder, OS resolver routing, local CA/certs, trust stores, port inspection, elevation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
x509-parser = "0.18"
time = "0.3"
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
# GetExtendedTcpTable / GetExtendedUdpTable: locale-independent port owners (P1-12)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tempfile = "3"
